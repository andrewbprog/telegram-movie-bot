services:
  db:
    image: postgres:15-alpine
    container_name: tlg_postgresql
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tlgbs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - service_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  service_network:
    driver: bridge
